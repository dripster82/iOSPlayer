# XcodeGen spec. Run `xcodegen generate` in this folder to produce Reel.xcodeproj.
# Install XcodeGen with `brew install xcodegen`. See README.md for the manual alternative.
name: Reel
options:
  bundleIdPrefix: uk.co.ketelle
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.3"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  ReelKit:
    path: Packages/ReelKit

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: 834D8P4J32   # Team "Paul Ketelle" (same as AiBrain)
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  Reel:
    type: application
    platform: iOS
    supportedDestinations: [iOS, iPadOS]
    # Shipped API keys live in Secrets.xcconfig (git-ignored; Scripts/ensure-secrets.sh makes an empty one).
    configFiles:
      Debug: Secrets.xcconfig
      Release: Secrets.xcconfig
    sources:
      - path: Reel
        excludes: [Demo]
      - path: Reel/Demo
        type: folder
        buildPhase: resources
    dependencies:
      - package: ReelKit
        products: [MediaCore, Metadata, MediaSources, Playback, Library, Sync]
    entitlements:
      # XcodeGen REWRITES this file from `properties` on every `xcodegen generate`; an entry with only a
      # path produces an empty dict and a build signed without iCloud. Keep the keys here.
      path: Reel/Reel.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.uk.co.ketelle.reel]
        com.apple.developer.icloud-services: [CloudKit]
        keychain-access-groups: [$(AppIdentifierPrefix)uk.co.ketelle.reel]
        aps-environment: development
    info:
      path: Reel/Info.plist
      properties:
        CFBundleDisplayName: Reel
        # Built-in keys from Secrets.xcconfig; empty when the file has none.
        REEL_TMDB_KEY: $(REEL_TMDB_KEY)
        REEL_FANART_KEY: $(REEL_FANART_KEY)
        REEL_OPENSUBTITLES_KEY: $(REEL_OPENSUBTITLES_KEY)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [audio, processing, remote-notification]
        BGTaskSchedulerPermittedIdentifiers: [uk.co.ketelle.reel.scan]
        NSLocalNetworkUsageDescription: Reel looks for NAS shares and media servers on your network so you can add them as sources.
        NSBonjourServices: [_smb._tcp, _webdav._tcp, _webdavs._tcp, _afpovertcp._tcp]
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        # "Open in Reel": other apps (DS file, Files, Safari downloads, share sheets) offer Reel for any video.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Video
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [public.movie, public.video, public.audiovisual-content, public.mpeg-4, com.apple.m4v-video, com.apple.quicktime-movie, public.avi, public.mpeg, public.3gpp, org.matroska.mkv, org.webmproject.webm, public.mpeg-2-transport-stream, com.microsoft.windows-media-wmv, public.audio, public.mp3, com.apple.m4a-audio, org.xiph.flac]
          # Other players (Infuse, VLC) each import .mkv under their own identifier, and iOS resolves an
          # extension to one of them; a file that resolves to theirs never matches ours. Accepting any
          # data, as they do, keeps Reel in every "Open in" list; the app decides what it can play.
          - CFBundleTypeName: File
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.data, public.content, public.item]
        # reel://play?url=<percent-encoded URL>  and the Infuse-style  reel://x-callback-url/play?url=...
        CFBundleURLTypes:
          - CFBundleURLName: uk.co.ketelle.reel
            CFBundleURLSchemes: [reel]
          # DS file, Documents and others hand streams to "VLC" through vlc-x-callback://x-callback-url/stream?url=…
          # They only know a fixed list of players, so answering VLC's scheme is the only way into their menus.
          # When VLC itself is installed iOS picks one of the two; nothing Reel can do about that.
          - CFBundleURLName: uk.co.ketelle.reel.vlc-compat
            CFBundleURLSchemes: [vlc-x-callback, vlc, vlcx]
        # Matroska has no system UTI; declaring it lets .mkv files route here.
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.matroska.mkv
            UTTypeDescription: Matroska Video
            UTTypeConformsTo: [public.movie]
            UTTypeTagSpecification:
              public.filename-extension: [mkv, mka, mks]
              public.mime-type: [video/x-matroska]
          - UTTypeIdentifier: org.webmproject.webm
            UTTypeDescription: WebM Video
            UTTypeConformsTo: [public.movie]
            UTTypeTagSpecification:
              public.filename-extension: [webm]
              public.mime-type: [video/webm]
          - UTTypeIdentifier: org.xiph.flac
            UTTypeDescription: FLAC Audio
            UTTypeConformsTo: [public.audio]
            UTTypeTagSpecification:
              public.filename-extension: [flac]
              public.mime-type: [audio/flac]
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          # Many home NAS WebDAV endpoints are plain HTTP on the LAN.
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.co.ketelle.reel
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        ENABLE_PREVIEWS: true
    scheme:
      testTargets:
        - package: ReelKit/MediaCoreTests
        - package: ReelKit/MetadataTests
