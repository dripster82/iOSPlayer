<title>Reel Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap">
<style>
/* Layout: a device simulator on the left, a screen map + decision notes on the right; stacks at phone width. */
:root{
  --bg:#f3f1ec; --fg:#1d1b18; --muted:#6d675d; --panel:#ffffff; --line:#dcd7cd;
  --accent:#c9741a; --accent-fg:#ffffff;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,sans-serif;
  /* in-app tokens (dark, cinema) */
  --a-bg:#0d0e12; --a-bg2:#15171d; --a-card:#1d2028; --a-fg:#f4f2ee; --a-muted:#9a9890; --a-line:#272a33;
  --a-accent:#f0a33a; --a-accent-fg:#1a1200; --a-good:#5fc98a; --a-warn:#f2c14e; --a-bad:#ef6b5c;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#171614; --fg:#efece6; --muted:#9b958a; --panel:#211f1c; --line:#35322d; --accent:#f0a33a; --accent-fg:#1a1200; color-scheme:dark } }
:root[data-theme="dark"]{ --bg:#171614; --fg:#efece6; --muted:#9b958a; --panel:#211f1c; --line:#35322d; --accent:#f0a33a; --accent-fg:#1a1200; color-scheme:dark }

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
button{font:inherit;cursor:pointer}
.page{max-width:1240px;margin:0 auto}
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:baseline;justify-content:space-between;margin-bottom:18px}
.top h1{font-size:26px;font-weight:700;letter-spacing:-.01em}
.top p{margin:0;color:var(--muted);max-width:60ch}
.controls{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;color:var(--fg);padding:7px 12px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

.work{display:grid;grid-template-columns:minmax(0,auto) minmax(280px,380px);gap:28px;align-items:start}
@media (max-width:900px){.work{grid-template-columns:1fr}}

/* Device frame */
.stage{display:flex;justify-content:center;min-width:0}
.device{position:relative;background:#000;border-radius:48px;padding:12px;box-shadow:0 30px 70px rgba(0,0,0,.35),inset 0 0 0 2px #3a3a3a;transition:width .3s,height .3s;max-width:100%}
.device.phone{width:390px;height:844px}
.device.phone.land{width:844px;height:390px}
.device.pad{width:1024px;height:768px;border-radius:36px}
.screen{position:relative;width:100%;height:100%;border-radius:38px;overflow:hidden;background:var(--a-bg);color:var(--a-fg);font-family:var(--body);font-size:15px;isolation:isolate}
.device.pad .screen{border-radius:26px}
.notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px;z-index:50}
.device.land .notch,.device.pad .notch{display:none}
.statusbar{position:absolute;top:0;left:0;right:0;height:50px;display:flex;justify-content:space-between;align-items:center;padding:0 28px;font-size:14px;font-weight:600;z-index:40;pointer-events:none}
.device.land .statusbar,.device.pad .statusbar{height:28px;padding:0 20px;font-size:12px}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:130px;height:5px;border-radius:3px;background:rgba(255,255,255,.5);z-index:50}

/* in-app light theme (toggle in Settings) */
.screen.light{--a-bg:#f6f5f1;--a-bg2:#ecebe6;--a-card:#ffffff;--a-fg:#15161a;--a-muted:#6b6a65;--a-line:#dcdbd4;--a-accent:#c9741a;--a-accent-fg:#fff}
.screen.light .homebar{background:rgba(0,0,0,.4)}

/* in-app shell */
.app{position:absolute;inset:0;display:flex;flex-direction:column}
.device.pad .app{flex-direction:row}
.view{flex:1;min-height:0;overflow:auto;padding:54px 16px 96px;scrollbar-width:thin}
.device.pad .view{padding:40px 28px 40px}
.device.land .view{padding:36px 40px 20px}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:84px;padding:8px 10px 22px;display:flex;background:color-mix(in srgb,var(--a-bg2) 86%,transparent);backdrop-filter:blur(18px);border-top:1px solid var(--a-line);z-index:30}
.tabbar button{flex:1;border:0;background:none;color:var(--a-muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600}
.tabbar button svg{width:26px;height:26px}
.tabbar button[aria-current="page"]{color:var(--a-accent)}
.sidebar{width:230px;flex:none;background:var(--a-bg2);border-right:1px solid var(--a-line);padding:44px 12px 20px;display:flex;flex-direction:column;gap:2px}
.sidebar .brand{font-family:var(--display);font-weight:700;font-size:20px;padding:6px 10px 14px;color:var(--a-accent)}
.sidebar button{border:0;background:none;color:var(--a-fg);text-align:left;padding:9px 10px;border-radius:9px;display:flex;gap:10px;align-items:center;font-weight:500}
.sidebar button svg{width:20px;height:20px;color:var(--a-muted)}
.sidebar button[aria-current="page"]{background:var(--a-card)}
.sidebar button[aria-current="page"] svg{color:var(--a-accent)}
.sidebar .grow{flex:1}

/* in-app components */
.nav{display:flex;align-items:center;gap:10px;margin-bottom:14px;min-height:34px}
.nav h2{font-size:30px;font-weight:700;letter-spacing:-.02em;flex:1;font-family:var(--display)}
.nav h2.sm{font-size:19px;text-align:center}
.iconbtn{border:0;background:var(--a-card);color:var(--a-fg);width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;flex:none}
.iconbtn svg{width:18px;height:18px}
.iconbtn.ghost{background:none;color:var(--a-accent)}
.back{border:0;background:none;color:var(--a-accent);font-weight:600;display:inline-flex;align-items:center;gap:2px;padding:0;font-size:16px}
.row-h{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 8px}
.row-h h3{font-size:17px;font-weight:600}
.row-h button{border:0;background:none;color:var(--a-accent);font-weight:600;font-size:14px}
.hrow{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 4px}
.hrow::-webkit-scrollbar{display:none}
.card{flex:none;width:118px;border:0;background:none;color:inherit;text-align:left;padding:0}
.card.wide{width:200px}
.poster{position:relative;aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:var(--a-card);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:38px;color:rgba(255,255,255,.85);text-shadow:0 2px 8px rgba(0,0,0,.4);width:100%}
.poster.still{aspect-ratio:16/9;font-size:28px}
.poster .badge{position:absolute;top:6px;right:6px;background:var(--a-accent);color:var(--a-accent-fg);font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;font-family:var(--body);text-shadow:none}
.poster .badge.low{background:var(--a-warn)}
.poster .tick{position:absolute;top:6px;left:6px;width:20px;height:20px;border-radius:50%;background:var(--a-good);display:grid;place-items:center}
.poster .tick svg{width:12px;height:12px;color:#063}
.poster .fav{position:absolute;bottom:6px;right:6px;width:22px;height:22px;color:var(--a-accent);filter:drop-shadow(0 1px 3px rgba(0,0,0,.6))}
.screen span>svg{display:block;width:100%;height:100%}
.card{min-width:0}
.prog{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(0,0,0,.45)}
.prog i{display:block;height:100%;background:var(--a-accent)}
.card .t{font-size:13px;font-weight:600;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .s{font-size:12px;color:var(--a-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 10px}
.device.pad .grid{grid-template-columns:repeat(6,minmax(0,1fr))}
.grid .card{width:auto;min-width:0}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 12px;padding:0 16px}
.chip{border:1px solid var(--a-line);background:var(--a-card);color:var(--a-fg);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--a-accent);color:var(--a-accent-fg);border-color:var(--a-accent)}
.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:700;font-size:16px;background:var(--a-accent);color:var(--a-accent-fg);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.sec{background:var(--a-card);color:var(--a-fg)}
.btn.block{width:100%}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:9px}
.btn svg{width:18px;height:18px}
.list{background:var(--a-card);border-radius:14px;overflow:hidden}
.list .item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--a-line);width:100%;border-left:0;border-right:0;border-bottom:0;background:none;color:inherit;text-align:left;font:inherit}
.list .item:first-child{border-top:0}
.list .item .m{flex:1;min-width:0}
.list .item .m b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .item .m span{display:block;font-size:13px;color:var(--a-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .item .chev{color:var(--a-muted);width:18px;height:18px;flex:none}
.list .item .val{color:var(--a-muted);font-size:14px}
.group-l{font-size:12px;color:var(--a-muted);text-transform:uppercase;letter-spacing:.06em;margin:18px 4px 6px;font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.dot.on{background:var(--a-good)} .dot.off{background:var(--a-bad)} .dot.sync{background:var(--a-warn)}
.pill{font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;background:var(--a-bg2);color:var(--a-muted);text-transform:uppercase;letter-spacing:.04em}
.pill.tv{color:#7fb4f5} .pill.film{color:var(--a-accent)} .pill.mixed{color:#c69ef5}
.toggle{width:50px;height:30px;border-radius:15px;background:#555;position:relative;border:0;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .2s}
.toggle[aria-checked="true"]{background:var(--a-good)}
.toggle[aria-checked="true"]::after{left:22px}
.hero{position:relative;margin:-54px -16px 14px;height:260px;overflow:hidden}
.device.pad .hero{margin:-40px -28px 18px;height:340px}
.hero .bd{position:absolute;inset:0}
.hero .fade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(13,14,18,.1) 30%,var(--a-bg) 100%)}
.hero .nav{position:absolute;top:50px;left:16px;right:16px;z-index:2}
.device.pad .hero .nav{top:36px;left:28px;right:28px}
.hero .meta{position:absolute;left:16px;right:16px;bottom:8px;display:flex;gap:14px;align-items:flex-end}
.device.pad .hero .meta{left:28px;right:28px}
.hero .meta .poster{width:96px;flex:none;min-width:96px;box-shadow:0 8px 24px rgba(0,0,0,.5);font-size:30px}
.hero .meta h2{font-size:24px;font-weight:700;line-height:1.1;font-family:var(--display)}
.hero .meta .sub{color:var(--a-muted);font-size:13px;margin-top:4px}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.facts span{font-size:12px;border:1px solid var(--a-line);border-radius:6px;padding:3px 7px;color:var(--a-muted)}
.ov{color:var(--a-fg);font-size:14px;line-height:1.5;margin:10px 0}
.cast{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.cast div{flex:none;width:70px;text-align:center;font-size:11px;color:var(--a-muted)}
.cast .av{width:56px;height:56px;border-radius:50%;margin:0 auto 4px;display:grid;place-items:center;font-weight:700;color:#fff;font-size:18px}
.ep{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--a-line);width:100%;border-left:0;border-right:0;border-bottom:0;background:none;color:inherit;text-align:left;font:inherit;align-items:center}
.ep:first-child{border-top:0}
.ep .poster{width:120px;flex:none;font-size:18px}
.ep .m{flex:1;min-width:0}
.ep .m b{display:block;font-weight:600;font-size:14px}
.ep .m span{display:block;font-size:12px;color:var(--a-muted);margin-top:2px}
.ep .m p{margin:4px 0 0;font-size:12px;color:var(--a-muted);display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:13px;color:var(--a-muted);font-weight:500}
.field input,.field select{font:inherit;background:var(--a-card);border:1px solid var(--a-line);color:var(--a-fg);border-radius:10px;padding:11px 12px;font-size:15px;width:100%}
.search{display:flex;align-items:center;gap:8px;background:var(--a-card);border-radius:12px;padding:10px 12px;margin-bottom:12px;color:var(--a-muted)}
.search input{flex:1;border:0;background:none;color:var(--a-fg);font:inherit;font-size:16px;outline:0;min-width:0}
.search svg{width:18px;height:18px;flex:none}
.banner{display:flex;align-items:center;gap:10px;background:var(--a-card);border-radius:12px;padding:10px 12px;margin:0 0 14px;font-size:13px;border-left:3px solid var(--a-warn)}
.banner.err{border-left-color:var(--a-bad)}
.banner.ok{border-left-color:var(--a-good)}
.banner .m{flex:1}
.banner button{border:0;background:none;color:var(--a-accent);font-weight:600;font:inherit}
.empty{text-align:center;color:var(--a-muted);padding:40px 20px;font-size:14px}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:60;display:flex;align-items:flex-end}
.device.pad .sheet-bg,.device.land .sheet-bg{align-items:center;justify-content:center}
.sheet{background:var(--a-bg2);border-radius:20px 20px 0 0;padding:10px 16px 34px;width:100%;max-height:85%;overflow:auto;color:var(--a-fg)}
.device.pad .sheet,.device.land .sheet{border-radius:20px;width:min(520px,92%);max-height:90%;padding-bottom:16px}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--a-line);margin:0 auto 12px}
.sheet h3{font-size:17px;font-weight:600;margin:0 0 10px;font-family:var(--body)}
.radio{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--a-line);width:100%;border-left:0;border-right:0;border-bottom:0;background:none;color:inherit;text-align:left;font:inherit}
.radio:first-of-type{border-top:0}
.radio .m{flex:1}
.radio .m span{display:block;font-size:12px;color:var(--a-muted)}
.radio .chk{width:20px;height:20px;color:var(--a-accent);flex:none;visibility:hidden}
.radio[aria-checked="true"] .chk{visibility:visible}
.stepper{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:10px 0;border-top:1px solid var(--a-line)}
.stepper .ctl{display:inline-flex;background:var(--a-card);border-radius:9px;overflow:hidden}
.stepper .ctl button{border:0;background:none;color:var(--a-fg);padding:6px 12px;font-weight:700}
.stepper .ctl b{padding:6px 10px;min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
.progressbar{height:6px;border-radius:3px;background:var(--a-card);overflow:hidden;margin:10px 0}
.progressbar i{display:block;height:100%;background:var(--a-accent);transition:width .4s}
.steps{display:flex;gap:6px;justify-content:center;margin:10px 0 18px}
.steps i{width:8px;height:8px;border-radius:50%;background:var(--a-line)}
.steps i.on{background:var(--a-accent)}
.welcome{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:30px 28px 60px;background:radial-gradient(120% 70% at 50% 0%,#3a2a12 0%,var(--a-bg) 70%)}
.welcome h2{font-family:var(--display);font-size:40px;font-weight:700;line-height:1.05;letter-spacing:-.02em;margin-bottom:10px}
.welcome p{color:var(--a-muted);margin:0 0 24px;font-size:15px}
.logo{width:72px;height:72px;border-radius:20px;background:var(--a-accent);display:grid;place-items:center;margin-bottom:auto;margin-top:70px}
.logo svg{width:40px;height:40px;color:var(--a-accent-fg)}
.version{display:flex;gap:10px;align-items:center;background:var(--a-card);border-radius:12px;padding:10px 12px;margin-bottom:8px;width:100%;border:2px solid transparent;color:inherit;text-align:left;font:inherit}
.version[aria-checked="true"]{border-color:var(--a-accent)}
.version .m{flex:1;min-width:0}
.version .m b{display:block;font-size:14px}
.version .m span{display:block;font-size:12px;color:var(--a-muted)}
.menu{position:absolute;z-index:70;background:var(--a-bg2);border:1px solid var(--a-line);border-radius:12px;min-width:200px;box-shadow:0 10px 30px rgba(0,0,0,.5);overflow:hidden}
.menu button{display:flex;width:100%;border:0;background:none;color:var(--a-fg);padding:11px 14px;text-align:left;font:inherit;gap:10px;align-items:center;border-top:1px solid var(--a-line)}
.menu button:first-child{border-top:0}
.menu button svg{width:17px;height:17px;color:var(--a-muted)}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:100px;background:var(--a-card);color:var(--a-fg);padding:9px 14px;border-radius:999px;font-size:13px;font-weight:600;z-index:80;box-shadow:0 6px 20px rgba(0,0,0,.4);animation:toastin .25s ease-out}
.device.pad .toast,.device.land .toast{bottom:30px}
@keyframes toastin{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.gest-hint{position:absolute;inset:0;z-index:5;pointer-events:none;display:grid;grid-template-columns:1fr 1fr 1fr;color:rgba(255,255,255,.35);font-size:11px;font-weight:600;text-align:center;align-items:center;opacity:0;transition:opacity .3s}
.player.show-hints .gest-hint{opacity:1}

/* Player */
.player{position:absolute;inset:0;background:#000;color:#fff;overflow:hidden;user-select:none}
.player .video{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(80% 60% at 50% 40%,#26303a 0%,#05070a 80%)}
.player .video .fake{font-family:var(--display);font-weight:700;font-size:clamp(28px,6vw,60px);color:rgba(255,255,255,.08);letter-spacing:-.02em;text-align:center}
.player .buffering{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.player .spin{width:40px;height:40px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:#fff;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.player .ui{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;justify-content:space-between;padding:22px 28px 18px;background:linear-gradient(to bottom,rgba(0,0,0,.6),transparent 25%,transparent 70%,rgba(0,0,0,.75));transition:opacity .25s}
.player .ui.hidden{opacity:0;pointer-events:none}
.player .ptop{display:flex;align-items:center;gap:10px}
.player .ptop .title{flex:1;min-width:0}
.player .ptop .title b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.player .ptop .title span{font-size:12px;color:rgba(255,255,255,.65)}
.player .pbtn{border:0;background:rgba(255,255,255,.1);color:#fff;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none}
.player .pbtn svg{width:19px;height:19px}
.player .pbtn.on{background:var(--a-accent);color:var(--a-accent-fg)}
.player .pmid{display:flex;justify-content:center;gap:50px;align-items:center}
.player .pmid .pbtn{width:54px;height:54px;background:rgba(255,255,255,.12)}
.player .pmid .pbtn.big{width:74px;height:74px;background:#fff;color:#000}
.player .pmid .pbtn.big svg{width:32px;height:32px}
.player .pmid .pbtn svg{width:26px;height:26px}
.player .pbot{display:flex;flex-direction:column;gap:8px}
.player .scrub{position:relative;height:28px;display:flex;align-items:center;cursor:pointer}

 pip:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><rect x="12" y="12" width="7" height="5" rx="1" fill="currentColor"/></svg>',

 star:'<svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><path d="M12 2l3 7 7 .6-5.3 4.7L18.3 22 12 18l-6.3 4 1.6-7.7L2 9.6 9 9z"/></svg>',
 folder:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
 wrench:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0 5 5L22 9a6 6 0 0 1-8.5 7.6L7 23l-3-3 6.4-6.5A6 6 0 0 1 15 5z"/></svg>',
 eye:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
 clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
 plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
 list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
 refresh:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0 2.4 5.7M20 4v7h-7"/></svg>',
};

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fmt(sec){sec=Math.max(0,Math.round(sec));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return (h?h+':':'')+String(m).padStart(h?2:1,'0')+':'+String(s).padStart(2,'0')}
function go(route,push=true){closeOverlays();if(push&&S.route!==route)S.stack.push(S.route);S.route=route;const base=route.split(':')[0];if(['home','tv','films','sources','search','settings'].includes(base))S.tab=base;if(['show','season'].includes(base))S.tab='tv';if(base==='film')S.tab='films';if(['source','addsource'].includes(base))S.tab='sources';render()}
function back(){closeOverlays();S.route=S.stack.pop()||S.tab||'home';render()}
function closeOverlays(){S.sheet=null;S.menu=null}
function toast(msg){S.toast=msg;clearTimeout(toastTimer);render();toastTimer=setTimeout(()=>{S.toast=null;render()},1800)}
function toggleFav(id){S.favs.has(id)?S.favs.delete(id):S.favs.add(id);toast(S.favs.has(id)?'Added to Favourites':'Removed from Favourites')}
function show(id){return SHOWS.find(s=>s.id===id)}
function film(id){return FILMS.find(f=>f.id===id)}
function posterHTML(title,opts={}){const cls='poster'+(opts.still?' still':'');return `<div class="${cls}" style="${art(title)}">${esc(title[0])}${opts.badge?`<span class="badge ${opts.badgeCls||''}">${esc(opts.badge)}</span>`:''}${opts.tick?`<span class="tick">${I.check}</span>`:''}${opts.fav?`<span class="fav">${I.heart}</span>`:''}${opts.progress?`<div class="prog"><i style="width:${opts.progress*100}%"></i></div>`:''}</div>`}
function cardHTML(item,kind,sub){const id=item.id;const isShow=kind==='show';const unw=isShow&&item.unwatched;return `<button class="card" data-go="${isShow?'show':'film'}:${id}" data-ctx="${kind}:${id}">${posterHTML(item.title,{badge:unw?String(unw):(item.conf==='low'?'?':null),badgeCls:item.conf==='low'&&!unw?'low':'',tick:!isShow&&item.watched,fav:S.favs.has(id),progress:!isShow&&item.progress>0&&item.progress<1?item.progress:0})}<div class="t">${esc(item.title)}</div><div class="s">${esc(sub||item.year)}</div></button>`}

/* ---------- app screens ---------- */
function tabbar(){
  const tabs=[['home','Home',I.home],['tv','TV',I.tv],['films','Films',I.film],['sources','Sources',I.src],['search','Search',I.search]];
  return `<nav class="tabbar">${tabs.map(([k,l,ic])=>`<button data-tab="${k}" aria-current="${S.tab===k?'page':'false'}">${ic}${l}</button>`).join('')}</nav>`;
}
function sidebar(){
  const items=[['home','Home',I.home],['tv','TV Shows',I.tv],['films','Films',I.film],['favourites','Favourites',I.hearto],['collections','Collections',I.list],['sources','Sources',I.src],['search','Search',I.search]];
  const cur=S.route.split(':')[0];
  return `<nav class="sidebar"><div class="brand">Reel</div>${items.map(([k,l,ic])=>`<button data-tab="${k}" aria-current="${(S.tab===k||cur===k)?'page':'false'}">${ic}${l}</button>`).join('')}<div class="grow"></div><button data-tab="settings" aria-current="${cur==='settings'?'page':'false'}">${I.gear}Settings</button></nav>`;
}
function navH(title,opts={}){return `<div class="nav">${opts.back?`<button class="back" data-back>${I.back}${esc(opts.backLabel||'Back')}</button>`:''}<h2 class="${opts.back?'sm':''}">${esc(title)}</h2>${opts.right||''}</div>`}

function screenHome(){
  const cont=[...SHOWS.filter(s=>s.progress),...FILMS.filter(f=>f.progress>0&&f.progress<1)];
  const nextUp=SHOWS.filter(s=>s.next&&!s.progress).slice(0,5);
  const offline=SOURCES.filter(s=>s.status==='offline');
  return navH('Home',{right:`<button class="iconbtn" data-go="needsreview" title="Needs Review" style="position:relative">${I.wrench}${S.review.length?`<span class="badge" style="position:absolute;top:-4px;right:-4px;background:var(--a-bad);color:#fff;font-size:10px;border-radius:9px;padding:0 5px;font-weight:700">${S.review.length}</span>`:''}</button><button class="iconbtn" data-go="settings">${I.gear}</button>`})
  +(offline.length?`<div class="banner"><div class="m"><b>${esc(offline[0].name)}</b> is offline. Showing cached library.</div><button data-go="source:${offline[0].id}">Details</button></div>`:'')
  +`<div class="row-h"><h3>Continue Watching</h3><button data-go="history">History</button></div><div class="hrow">${cont.map(x=>{const isShow=!!x.seasons;const sub=isShow?`S${x.next.s}E${x.next.e} · ${Math.round((1-x.progress)*44)} min left`:`${Math.round((1-x.progress)*x.runtime)} min left`;return `<button class="card wide" data-play="${isShow?'show':'film'}:${x.id}" data-ctx="${isShow?'show':'film'}:${x.id}">${posterHTML(x.title,{still:true,progress:x.progress})}<div class="t">${esc(x.title)}</div><div class="s">${sub}</div></button>`}).join('')}</div>`
  +`<div class="row-h"><h3>Next Up</h3><button data-go="tv">All shows</button></div><div class="hrow">${nextUp.map(s=>`<button class="card wide" data-play="show:${s.id}" data-ctx="show:${s.id}">${posterHTML(s.title,{still:true})}<div class="t">${esc(s.title)}</div><div class="s">S${s.next.s}E${s.next.e} · ${esc(episodes(s,s.next.s)[s.next.e-1].title)}</div></button>`).join('')}</div>`
  +`<div class="row-h"><h3>Favourites</h3><button data-go="favourites">See all</button></div><div class="hrow">${[...S.favs].map(id=>show(id)?cardHTML(show(id),'show'):film(id)?cardHTML(film(id),'film'):'').join('')||'<div class="empty">Long-press anything to add it here.</div>'}</div>`
  +`<div class="row-h"><h3>Recently Added</h3><button data-go="films">Films</button></div><div class="hrow">${[FILMS[3],FILMS[8],SHOWS[2],FILMS[1],FILMS[6]].map(x=>cardHTML(x,x.seasons?'show':'film',x.seasons?'Added today':'Added 2 days ago')).join('')}</div>`
  +`<div class="row-h"><h3>Unwatched Films</h3><button data-go="films">${FILMS.filter(f=>!f.watched).length} films</button></div><div class="hrow">${FILMS.filter(f=>!f.watched&&!f.progress).map(f=>cardHTML(f,'film')).join('')}</div>`;
}
function screenTV(){
  const f=S.tvFilter;let list=SHOWS.filter(s=>!S.hidden.has(s.id));if(f==='unwatched')list=list.filter(s=>s.unwatched);if(f==='fav')list=list.filter(s=>S.favs.has(s.id));
  return navH('TV Shows',{right:`<button class="iconbtn" data-sheet="sort">${I.list}</button>`})
  +`<div class="chips">${[['all','All'],['unwatched','Unwatched'],['fav','Favourites'],['drama','Drama'],['scifi','Sci-Fi'],['comedy','Comedy']].map(([k,l])=>`<button class="chip" data-tvf="${k}" aria-pressed="${f===k}">${l}</button>`).join('')}</div>`
  +`<div class="grid">${list.map(s=>cardHTML(s,'show',`${s.seasons} season${s.seasons>1?'s':''}`)).join('')}</div>`;
}
function screenShow(id){
  const s=show(id);const sel=S.seasonSel?.[id]||s.next?.s||1;const eps=episodes(s,sel);
  return `<div class="hero"><div class="bd" style="${art(s.title+'bd')}"></div><div class="fade"></div><div class="nav"><button class="back" data-back>${I.back}</button><span style="flex:1"></span><button class="iconbtn" data-fav="${id}" style="color:${S.favs.has(id)?'var(--a-accent)':'inherit'}">${S.favs.has(id)?I.heart:I.hearto}</button><button class="iconbtn" data-menu="show:${id}">${I.more}</button></div><div class="meta"><div class="poster" style="${art(s.title)}">${esc(s.title[0])}</div><div><h2>${esc(s.title)}</h2><div class="sub">${s.year} · ${s.seasons} seasons · ${s.genres.join(', ')}</div></div></div></div>`
  +`<div style="display:flex;gap:8px;margin-bottom:8px"><button class="btn" style="flex:1" data-play="show:${id}">${I.play}${s.next?`Play S${s.next.s}E${s.next.e}`:'Play from start'}</button><button class="btn sec" data-sheet="markseason:${id}:${sel}">Mark season</button></div>`
  +`<div class="facts"><span>${I.star} ${s.rating}</span><span>TMDb</span>${s.conf==='low'?'<span style="color:var(--a-warn)">Low-confidence match</span>':''}<span>${s.unwatched} unwatched</span></div>`
  +`<p class="ov">${esc(s.overview)}</p>`
  +(s.cast.length?`<div class="row-h"><h3>Cast</h3></div><div class="cast">${s.cast.map(c=>`<div><div class="av" style="${art(c)}">${esc(c[0])}</div>${esc(c)}</div>`).join('')}</div>`:'')
  +`<div class="row-h"><h3>Episodes</h3></div><div class="chips">${Array.from({length:s.seasons},(_,i)=>i+1).map(n=>`<button class="chip" data-season="${id}:${n}" aria-pressed="${n===sel}">Season ${n}</button>`).join('')}</div>`
  +`<div>${eps.map(e=>`<button class="ep" data-play="ep:${id}:${sel}:${e.e}" data-ctx="ep:${e.key}">${posterHTML(e.title+e.e,{still:true,tick:e.watched,progress:e.progress})}<div class="m"><b>${e.e}. ${esc(e.title)}</b><span>${e.runtime} min${e.progress?` · ${Math.round((1-e.progress)*e.runtime)} min left`:''}</span><p>${esc(e.overview)}</p></div></button>`).join('')}</div>`;
}
function screenFilms(){
  let list=FILMS.filter(f=>!S.hidden.has(f.id));const ff=S.filmFilter;if(ff==='unwatched')list=list.filter(f=>!f.watched);if(ff==='fav')list=list.filter(f=>S.favs.has(f.id));if(ff==='4k')list=list.filter(f=>f.versions.some(v=>v.res==='2160p'));
  const sorters={title:(a,b)=>a.title.localeCompare(b.title),year:(a,b)=>b.year-a.year,rating:(a,b)=>b.rating-a.rating,runtime:(a,b)=>a.runtime-b.runtime};list=[...list].sort(sorters[S.filmSort]);
  return navH('Films',{right:`<button class="iconbtn" data-sheet="sort">${I.list}</button>`})
  +`<div class="chips">${[['all','All'],['unwatched','Unwatched'],['fav','Favourites'],['4k','4K'],['genre','Genre ▾'],['year','Year ▾']].map(([k,l])=>`<button class="chip" data-ff="${k}" aria-pressed="${ff===k}">${l}</button>`).join('')}</div>`
  +`<div class="grid">${list.map(f=>cardHTML(f,'film',`${f.year} · ${f.versions[0].res}`)).join('')}</div>`;
}
function screenFilm(id){
  const f=film(id);const vi=S.versionSel?.[id]||0;const v=f.versions[vi];
  return `<div class="hero"><div class="bd" style="${art(f.title+'bd')}"></div><div class="fade"></div><div class="nav"><button class="back" data-back>${I.back}</button><span style="flex:1"></span><button class="iconbtn" data-fav="${id}" style="color:${S.favs.has(id)?'var(--a-accent)':'inherit'}">${S.favs.has(id)?I.heart:I.hearto}</button><button class="iconbtn" data-menu="film:${id}">${I.more}</button></div><div class="meta"><div class="poster" style="${art(f.title)}">${esc(f.title[0])}</div><div><h2>${esc(f.title)}</h2><div class="sub">${f.year} · ${f.runtime} min · ${f.genres.join(', ')}</div></div></div></div>`
  +`<div style="display:flex;gap:8px;margin-bottom:8px"><button class="btn" style="flex:1" data-play="film:${id}">${I.play}${f.progress>0&&f.progress<1?`Resume at ${fmt(f.progress*f.runtime*60)}`:'Play'}</button>${f.progress>0&&f.progress<1?`<button class="btn sec" data-play="film:${id}:restart">Start over</button>`:''}</div>`
  +`<div class="facts"><span>${I.star} ${f.rating}</span><span>${v.res}</span><span>${v.codec}</span><span>${v.container}</span>${f.watched?'<span style="color:var(--a-good)">Watched</span>':''}${f.conf==='low'?'<span style="color:var(--a-warn)">Low-confidence match</span>':''}</div>`
  +`<p class="ov">${esc(f.overview)}</p>`
  +(f.cast.length?`<div class="row-h"><h3>Cast</h3></div><div class="cast">${f.cast.map(c=>`<div><div class="av" style="${art(c)}">${esc(c[0])}</div>${esc(c)}</div>`).join('')}</div>`:'')
  +(f.versions.length>1?`<div class="row-h"><h3>Versions</h3><span style="font-size:12px;color:var(--a-muted)">Tap to set preferred</span></div>${f.versions.map((x,i)=>`<button class="version" data-version="${id}:${i}" aria-checked="${i===vi}"><div class="m"><b>${x.res} · ${esc(x.codec)} · ${x.container}</b><span>${esc(x.audio[0])} · ${x.size} · ${esc(x.src)}</span></div>${i===vi?`<span style="color:var(--a-accent);width:20px;height:20px">${I.check}</span>`:''}</button>`).join('')}`:'')
  +`<div class="row-h"><h3>File</h3></div><div class="list">
     <div class="item"><div class="m"><b>Video</b><span>${v.res} · ${esc(v.codec)}</span></div></div>
     <div class="item"><div class="m"><b>Audio</b><span>${v.audio.map(esc).join(' · ')}</span></div></div>
     <div class="item"><div class="m"><b>Subtitles</b><span>${v.subs.length?v.subs.map(esc).join(' · '):'None embedded · Search online in player'}</span></div></div>
     <div class="item"><div class="m"><b>Source</b><span>${esc(v.src)} · ${v.size}</span></div></div></div>`;
}
function screenSources(){
  return navH('Sources',{right:`<button class="iconbtn" data-go="addsource">${I.plus}</button>`})
  +`<div class="list">${SOURCES.map(s=>`<button class="item" data-go="source:${s.id}"><span class="dot ${s.status==='online'?'on':s.status==='offline'?'off':'sync'}"></span><div class="m"><b>${esc(s.name)}</b><span>${s.type} · ${esc(s.host)} · ${s.items} items · Scanned ${esc(s.lastScan)}</span></div>${I.chev.replace('<svg','<svg class="chev"')}</button>`).join('')}</div>`
  +`<p class="hint" style="color:var(--a-muted);font-size:12px;margin:10px 4px">Passwords are kept in the device Keychain and never synced.</p>`
  +`<div class="group-l">Library scan</div><div class="list"><button class="item" data-toast="Scanning Synology NAS…"><div class="m"><b>Refresh all sources</b><span>Incremental: only new or changed files</span></div>${I.refresh.replace('<svg','<svg class="chev"')}</button><div class="item"><div class="m"><b>Scan daily in background</b></div><button class="toggle" aria-checked="true" data-setting="bgscan"></button></div><div class="item"><div class="m"><b>Scan on mobile data</b></div><button class="toggle" aria-checked="${S.settings.cellular}" data-setting="cellular"></button></div></div>`;
}
function screenSource(id){
  const s=SOURCES.find(x=>x.id===id);
  return navH(s.name,{back:true,right:`<button class="iconbtn" data-menu="source:${id}">${I.more}</button>`})
  +(s.status==='offline'?`<div class="banner err"><div class="m">Can't reach <b>${esc(s.host)}</b>. Last seen ${esc(s.lastScan)}.</div><button data-toast="Retrying…">Retry</button></div>`:`<div class="banner ok"><div class="m">Connected · ${s.type} · ${esc(s.host)}</div><button data-toast="Scanning…">Rescan</button></div>`)
  +`<div class="group-l">Folders · long-press to tag</div><div class="list">${s.folders.map((f,i)=>`<button class="item" data-sheet="tag:${id}:${i}">${I.folder.replace('<svg','<svg style="width:20px;height:20px;color:var(--a-muted)"')}<div class="m"><b>${esc(f.p)}</b><span>${f.n} files</span></div>${f.tag?`<span class="pill ${f.tag}">${f.tag==='tv'?'TV':f.tag==='film'?'Films':'Mixed'}</span>`:'<span class="pill">Untagged</span>'}</button>`).join('')}</div>`
  +`<div class="group-l">Browse</div><div class="list"><button class="item" data-go="browse:${id}"><div class="m"><b>Browse files</b><span>Plain file view. Play anything, even if it isn't in the library.</span></div>${I.chev.replace('<svg','<svg class="chev"')}</button></div>`
  +`<div class="group-l">Connection</div><div class="list"><div class="item"><div class="m"><b>Protocol</b></div><span class="val">${s.type}</span></div><div class="item"><div class="m"><b>Host</b></div><span class="val">${esc(s.host)}</span></div><div class="item"><div class="m"><b>Share / path</b></div><span class="val">${esc(s.share)}</span></div><button class="item" data-toast="Edit credentials sheet"><div class="m"><b>Credentials</b></div><span class="val">paul · ••••••••</span></button></div>`;
}
function screenBrowse(id){
  const s=SOURCES.find(x=>x.id===id);const files=['Harbour.Lights.S02E05.1080p.WEB-DL.x265-GRP.mkv','Harbour.Lights.S02E05.en.srt','Harbour.Lights.S02E06.1080p.WEB-DL.x265-GRP.mkv','Null.Island.2024.2160p.DV.HDR.Atmos.mkv','2023-08 Cornwall.mov','random_clip_final.avi'];
  return navH(s.share,{back:true,backLabel:s.name})
  +`<div class="list"><button class="item"><div class="m"><b>..</b></div></button>${['Season 1','Season 2','Season 3'].map(d=>`<button class="item" data-toast="Open ${d}">${I.folder.replace('<svg','<svg style="width:20px;height:20px;color:var(--a-accent)"')}<div class="m"><b>${d}</b></div>${I.chev.replace('<svg','<svg class="chev"')}</button>`).join('')}${files.map(f=>`<button class="item" data-play="file:${esc(f)}"><span style="width:20px;color:var(--a-muted)">${f.endsWith('.srt')?I.cc:I.film}</span><div class="m"><b>${esc(f)}</b><span>${f.endsWith('.srt')?'Subtitle sidecar':(Math.random()*20+1).toFixed(1)+' GB'}</span></div>${f.endsWith('.srt')?'':I.play.replace('<svg','<svg class="chev"')}</button>`).join('')}</div>`;
}
function screenAddSource(){
  const a=S.addSrc;
  if(a.step==='type')return navH('Add Source',{back:true,backLabel:'Cancel'})
    +`<div class="group-l">On this device</div><div class="list"><button class="item" data-add="local"><span style="width:20px;color:var(--a-accent)">${I.folder}</span><div class="m"><b>Files, USB or iCloud Drive</b><span>Pick a folder with the Files picker</span></div>${I.chev.replace('<svg','<svg class="chev"')}</button></div>`
    +`<div class="group-l">Found on your network</div><div class="list">${DISCOVERED.map((d,i)=>`<button class="item" data-add="disc:${i}"><span class="dot on"></span><div class="m"><b>${esc(d.name)}</b><span>${esc(d.host)}</span></div><span class="pill">${d.proto}</span></button>`).join('')}</div>`
    +`<div class="group-l">Or enter manually</div><div class="list">${['SMB','WebDAV','NFS','FTP / SFTP','DLNA'].map(p=>`<button class="item" data-add="manual:${p}"><div class="m"><b>${p}</b></div>${I.chev.replace('<svg','<svg class="chev"')}</button>`).join('')}</div>`;
  if(a.step==='form')return navH(a.proto+' share',{back:true})
    +`<div class="field"><label>Name</label><input id="as-name" value="${esc(a.name||'')}" placeholder="Living room NAS"></div>
       <div class="field"><label>Host or IP</label><input id="as-host" value="${esc(a.host)}" placeholder="192.168.1.20 or nas.local"></div>
       <div class="field"><label>${a.proto==='WebDAV'?'URL path':'Share'}</label><input id="as-share" value="${esc(a.share)}" placeholder="${a.proto==='WebDAV'?'/remote.php/dav/files/you':'video'}"></div>
       <div class="field"><label>Username (optional)</label><input id="as-user" value="${esc(a.user)}" placeholder="guest"></div>
       <div class="field"><label>Password</label><input id="as-pass" type="password" value="${esc(a.pass)}"></div>

/* ---------- player ---------- */
function curVersion(){const it=S.player.item;if(it?.kind==='film')return film(it.id).versions[S.versionSel?.[it.id]||0];return {audio:['English · E-AC3 5.1','English · AAC 2.0 (Commentary)'],subs:['English (SDH) · SRT','English (Forced) · PGS']}}
function openPlayer(spec){
  const [kind,id,a,b]=spec.split(':');let item;
  if(kind==='film'){const f=film(id);item={kind:'film',id,title:f.title,sub:`${f.year} · ${f.runtime} min`,dur:f.runtime*60,t:(a==='restart'?0:f.progress*f.runtime*60)};}
  else if(kind==='show'){const s=show(id);const n=s.next||{s:1,e:1};const ep=episodes(s,n.s)[n.e-1];item={kind:'ep',id,title:s.title,sub:`S${n.s}E${n.e} · ${ep.title}`,dur:ep.runtime*60,t:(s.progress||0)*ep.runtime*60,next:`S${n.s}E${n.e+1}`};}
  else if(kind==='ep'){const s=show(id);const ep=episodes(s,+a)[+b-1];item={kind:'ep',id,title:s.title,sub:`S${a}E${b} · ${ep.title}`,dur:ep.runtime*60,t:ep.progress*ep.runtime*60,next:`S${a}E${+b+1}`};}
  else{item={kind:'file',id,title:id,sub:'Not in library · playing file directly',dur:2700,t:0};}
  Object.assign(S.player,{open:true,item,t:item.t,dur:item.dur,playing:true,ui:true,buffering:true,upnext:false,err:false,locked:false,speed:1,audio:0,subs:1,hints:true});
  closeOverlays();if(S.device==='phone')$('#device').classList.add('land');
  setTimeout(()=>{S.player.buffering=false;render()},900);setTimeout(()=>{S.player.hints=false;render()},3000);
  armUI();startClock();render();
}
function closePlayer(){S.player.open=false;clearInterval(playTimer);clearTimeout(uiTimer);$('#device').classList.remove('land');toast('Progress saved');}
function armUI(){clearTimeout(uiTimer);S.player.ui=true;uiTimer=setTimeout(()=>{if(S.player.playing&&!S.sheet){S.player.ui=false;render()}},3000)}
function startClock(){clearInterval(playTimer);playTimer=setInterval(()=>{const p=S.player;if(!p.open||!p.playing||p.buffering||p.err)return;p.t=Math.min(p.dur,p.t+1*p.speed);if(p.t>=p.dur-20&&p.item.kind==='ep'&&!p.upnext){p.upnext=true;render()}if(p.t>=p.dur){p.playing=false}renderPlayerTimes()},1000)}
function renderPlayerTimes(){const el=$('#ptime');if(!el)return;const p=S.player;const pct=p.t/p.dur*100;el.textContent=fmt(p.t);$('#prem').textContent='−'+fmt(p.dur-p.t);$('#pfill').style.width=pct+'%';$('#pknob').style.left=pct+'%';}
function playerHTML(){
  const p=S.player;const pct=p.t/p.dur*100;const v=curVersion();const subs=['Off',...v.subs];const subOn=p.subs>0&&p.subs<subs.length;
  const chapters=[95,480,1140,1830,2440].filter(c=>c<p.dur);
  const intro=p.t>=95&&p.t<180;

function addSource(v){

}

  if(now-lastTap<300){lastTap=0;if(p.locked)return;const back=x<0.5;p.t=Math.max(0,Math.min(p.dur,p.t+(back?-1:1)*S.settings.skip));const f=document.createElement('div');f.className='flash '+(back?'l':'r');f.textContent=(back?'−':'+')+S.settings.skip+'s';$('#player').appendChild(f);setTimeout(()=>f.remove(),600);renderPlayerTimes();return}

function playerAction(a){
  const p=S.player;
  if(a==='close'){closePlayer();if(p.item.kind==='film'){const f=film(p.item.id);f.progress=Math.min(.99,p.t/p.dur)}else if(p.item.kind==='ep'){const s=show(p.item.id);s.progress=Math.min(.99,p.t/p.dur)}render();return}

  if(a==='prev'){p.t=0;renderPlayerTimes();armUI();return}
  if(a==='lock'){p.locked=true;p.ui=false;render();return}
  if(a==='unlock'){p.locked=false;p.ui=true;render();armUI();return}
  if(a==='fit'){p.fit=p.fit==='fit'?'fill':'fit';render();armUI();return}
  if(a==='air'){toast('AirPlay route picker (system). Video is mirrored with VLCKit.');return}
  if(a==='skipintro'){p.t=180;renderPlayerTimes();render();return}
  if(a==='simerr'){p.err=true;p.playing=false;render();return}
  if(a==='retry'){p.err=false;p.buffering=true;p.playing=true;render();setTimeout(()=>{p.buffering=false;render()},900);return}
  if(a==='switchver'){p.err=false;p.buffering=true;p.playing=true;toast('Switched to 1080p copy');setTimeout(()=>{p.buffering=false;render()},900);return}
  if(a==='simend'){p.t=p.dur-20;if(p.item.kind==='ep')p.upnext=true;render();return}
  if(a==='playnext'){playerAction('next');return}

}

$('#clear-note').addEventListener('click',()=>{const n=loadNotes();delete n[$('#note').dataset.key];saveNotes(n);renderSide()});
$('#copy-notes').addEventListener('click',async()=>{const n=loadNotes();const md=Object.keys(n).filter(k=>n[k].trim()).map(k=>`## ${label(k)}\n${n[k].trim()}`).join('\n\n')||'(no notes yet)';const btn=$('#copy-notes');try{await navigator.clipboard.writeText(md);btn.textContent='Copied';}catch{const ta=$('#note');const old=ta.value;ta.value=md;ta.select();btn.textContent='Select and copy';setTimeout(()=>{ta.value=old},4000)}setTimeout(()=>btn.textContent='Copy all notes',1500)});
$('#map').addEventListener('click',e=>{const b=e.target.closest('[data-map]');if(!b)return;const r=b.dataset.map;if(r==='player'){if(!S.player.open)openPlayer('show:s1');return}if(S.player.open)closePlayer();if(r==='welcome'){S.onboard.step=0}if(r==='onboard'){S.onboard.step=1;S.addSrc.step='type'}if(r==='addsource'){S.addSrc.step='type'}S.stack=['home'];S.route=r;closeOverlays();render()});
$('#dev-phone').addEventListener('click',()=>{S.device='phone';$('#dev-phone').setAttribute('aria-pressed','true');$('#dev-pad').setAttribute('aria-pressed','false');render()});
$('#dev-pad').addEventListener('click',()=>{S.device='pad';$('#dev-pad').setAttribute('aria-pressed','true');$('#dev-phone').setAttribute('aria-pressed','false');render()});
$('#go-firstrun').addEventListener('click',()=>{if(S.player.open)closePlayer();S.onboard.step=0;S.stack=[];S.route='welcome';render()});
$('#go-home').addEventListener('click',()=>{if(S.player.open)closePlayer();S.stack=[];S.route='home';S.tab='home';render()});
$('#go-player').addEventListener('click',()=>{if(!S.player.open)openPlayer('show:s1')});

render();
</script>
